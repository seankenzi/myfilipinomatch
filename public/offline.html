<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — MyFilipinoMatch</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #faf9f7;
      color: #2d2319;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #d94f5c;
    }
    p {
      font-size: 1rem;
      color: #6b5e50;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    button {
      background: #d94f5c;
      color: #fff;
      border: none;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #c4444f; }
    .hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #a09585;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please check your Wi-Fi or mobile data and try again.</p>
    <button onclick="window.location.reload()">Try Again</button>
    <p class="hint">MyFilipinoMatch will reconnect automatically when you're back online.</p>
  </div>
</body>
</html>
